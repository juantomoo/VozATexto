<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Glowing Soundwaves circle -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.25" stroke-dasharray="12 12"/>
  <circle cx="256" cy="230" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Microphone body -->
  <rect x="216" y="130" width="80" height="150" rx="40" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Microphone arc -->
  <path d="M 176 220 C 176 280 200 310 256 310 C 312 310 336 280 336 220" fill="none" stroke="#f1f5f9" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Stand stem and base -->
  <line x1="256" y1="310" x2="256" y2="370" stroke="#f1f5f9" stroke-width="20" stroke-linecap="round"/>
  <line x1="196" y1="370" x2="316" y2="370" stroke="#f1f5f9" stroke-width="20" stroke-linecap="round"/>

  <!-- Soundwave bars at bottom -->
  <rect x="156" y="415" width="16" height="30" rx="8" fill="#06b6d4" opacity="0.6"/>
  <rect x="186" y="405" width="16" height="50" rx="8" fill="#10b981"/>
  <rect x="216" y="395" width="16" height="70" rx="8" fill="#06b6d4"/>
  <rect x="246" y="388" width="16" height="84" rx="8" fill="#10b981"/>
  <rect x="276" y="395" width="16" height="70" rx="8" fill="#06b6d4"/>
  <rect x="306" y="405" width="16" height="50" rx="8" fill="#10b981"/>
  <rect x="336" y="415" width="16" height="30" rx="8" fill="#06b6d4" opacity="0.6"/>
</svg>
